<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">VisionTrack AI Attendance System Architecture</title>
  <desc id="desc">Data flows from the browser camera through Flask and OpenCV to local biometric storage and SQLite attendance reports.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1d33"/>
      <stop offset="1" stop-color="#172b4d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#background)"/>
  <text x="60" y="72" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">VisionTrack</text>
  <text x="60" y="106" fill="#a7c7f7" font-family="Arial, sans-serif" font-size="18">AI Smart Attendance System</text>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="60" y="180" width="210" height="170" rx="20" fill="#ffffff"/>
    <circle cx="165" cy="226" r="28" fill="#dbeafe"/>
    <path d="M148 226h34M165 209v34" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    <text x="165" y="285" text-anchor="middle" fill="#0f172a" font-size="21" font-weight="700">Browser Camera</text>
    <text x="165" y="315" text-anchor="middle" fill="#64748b" font-size="15">Registration &amp; check-in</text>

    <rect x="360" y="180" width="210" height="170" rx="20" fill="#ffffff"/>
    <circle cx="465" cy="226" r="28" fill="#dcfce7"/>
    <text x="465" y="235" text-anchor="middle" fill="#059669" font-size="25" font-weight="700">F</text>
    <text x="465" y="285" text-anchor="middle" fill="#0f172a" font-size="21" font-weight="700">Flask Backend</text>
    <text x="465" y="315" text-anchor="middle" fill="#64748b" font-size="15">Auth, routes &amp; API</text>

    <rect x="660" y="180" width="210" height="170" rx="20" fill="#ffffff"/>
    <circle cx="765" cy="226" r="28" fill="#ede9fe"/>
    <path d="M747 226c10-15 26-15 36 0-10 15-26 15-36 0Z" fill="none" stroke="#7c3aed" stroke-width="4"/>
    <circle cx="765" cy="226" r="6" fill="#7c3aed"/>
    <text x="765" y="285" text-anchor="middle" fill="#0f172a" font-size="21" font-weight="700">OpenCV Engine</text>
    <text x="765" y="315" text-anchor="middle" fill="#64748b" font-size="15">LBPH &amp; liveness</text>

    <rect x="960" y="140" width="180" height="130" rx="20" fill="#ffffff"/>
    <circle cx="1050" cy="182" r="22" fill="#fef3c7"/>
    <path d="M1036 174h28v18h-28z M1042 168h16v6h-16z" fill="#d97706"/>
    <text x="1050" y="228" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">Local Biometrics</text>
    <text x="1050" y="250" text-anchor="middle" fill="#64748b" font-size="13">Git-ignored storage</text>

    <rect x="960" y="310" width="180" height="130" rx="20" fill="#ffffff"/>
    <circle cx="1050" cy="352" r="22" fill="#dbeafe"/>
    <ellipse cx="1050" cy="344" rx="14" ry="6" fill="#2563eb"/>
    <path d="M1036 344v17c0 4 6 7 14 7s14-3 14-7v-17" fill="none" stroke="#2563eb" stroke-width="4"/>
    <text x="1050" y="398" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">SQLite Reports</text>
    <text x="1050" y="420" text-anchor="middle" fill="#64748b" font-size="13">Attendance &amp; CSV</text>
  </g>

  <g fill="none" stroke="#60a5fa" stroke-width="5" marker-end="url(#arrow)">
    <path d="M275 265H345"/>
    <path d="M575 265H645"/>
    <path d="M875 230C915 230 920 205 945 205"/>
    <path d="M875 300C915 300 920 375 945 375"/>
  </g>
  <text x="600" y="474" text-anchor="middle" fill="#9fbce8" font-family="Arial, sans-serif" font-size="15">Privacy-first academic prototype: biometric data stays on the local machine</text>
</svg>
