{% extends 'base.html' %}{% block heading %}Register Student{% endblock %}{% block content %}<section class="camera-grid"><article class="panel"><h3>Student details</h3><div class="form-grid"><label>Student ID<input id="student_code" required placeholder="e.g. 4MH23CS029"></label><label>Full name<input id="name" required></label><label>Department<input id="department" required value="Computer Science"></label><label>Year<select id="year"><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option selected>4th Year</option></select></label><label class="wide">Email<input type="email" id="email"></label></div><div class="privacy">Face samples are stored only in the local <code>instance</code> folder and excluded from GitHub.</div></article><article class="panel camera-panel"><h3>Capture face samples</h3><video id="video" autoplay playsinline></video><canvas id="canvas" hidden></canvas><p id="instruction">Look directly at the camera in good lighting.</p><div class="capture-count"><span id="count">0</span>/5 samples</div><button class="primary" id="capture" onclick="captureRegistration()">Capture sample</button><button class="success" id="register" onclick="submitRegistration()" disabled>Train and register</button><div id="result"></div></article></section>{% endblock %}
